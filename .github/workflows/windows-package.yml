name: Build Windows portable package

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: compress-images
          environment-file: packaging/windows/environment.yml
          auto-activate-base: false
          miniforge-version: latest
      - name: Build portable bundle
        shell: bash -el {0}
        run: python packaging/windows/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: compress-images-windows-x64
          path: packaging/windows/build/compress-images-windows-x64.zip
      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/build/compress-images-windows-x64.zip
