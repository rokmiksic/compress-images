name: Build Windows portable package

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: compress-images
          environment-file: packaging/windows/environment.yml
          auto-activate-base: false
          miniforge-version: latest
      - name: Build portable bundle
        shell: bash -el {0}
        run: python packaging/windows/build_windows.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version -match '^v(\d+\.\d+\.\d+)$') { $env:APP_VERSION = $Matches[1] } else { $env:APP_VERSION = '0.0.0' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'packaging/windows/installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: compress-images-windows-x64
          path: |
            packaging/windows/build/compress-images-windows-x64.zip
            packaging/windows/build/compress-images-windows-x64-setup.exe
      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/windows/build/compress-images-windows-x64.zip
            packaging/windows/build/compress-images-windows-x64-setup.exe
