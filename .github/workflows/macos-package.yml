name: Build macOS packages

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Create conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: compress-images
          environment-file: packaging/macos/environment.yml
          auto-activate-base: false
          miniforge-version: latest
      - name: Build macOS app bundle
        shell: bash -el {0}
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$APP_VERSION" == v* ]]; then APP_VERSION="${APP_VERSION#v}"; export APP_VERSION; else export APP_VERSION="0.0.0"; fi
          python packaging/macos/build_macos.py
      - name: Build DMG
        shell: bash -el {0}
        run: |
          hdiutil create -volname "Compress Images" -srcfolder "packaging/macos/build/dmg-root" -ov -format UDZO "packaging/macos/build/compress-images-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: compress-images-macos-${{ matrix.arch }}
          path: |
            packaging/macos/build/compress-images-macos-${{ matrix.arch }}.zip
            packaging/macos/build/compress-images-macos-${{ matrix.arch }}.dmg
      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/macos/build/compress-images-macos-${{ matrix.arch }}.zip
            packaging/macos/build/compress-images-macos-${{ matrix.arch }}.dmg
